name: 一键编译 APK

# 触发方式：
#   1. 把整个工程推到 GitHub 仓库（main 或 master 分支）后自动触发；
#   2. 在 GitHub 仓库页面的 Actions 标签里手动点 “Run workflow” 也可以。
# 编译完成后在 Actions 页面底部下载 「CoopanionTablePet-debug」 这个构件，
# 里面就是可以直接安装的 app-debug.apk。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8.x 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 本工程未携带 gradlew 可执行文件（无电脑无法生成），CI 里用官方发行版
      # 先跑一次 `gradle wrapper` 自动补齐 gradlew + wrapper.jar，再正常构建。
      - name: 准备 Gradle 8.7 并补齐 wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --no-daemon
          rm -rf gradle-8.7 gradle-8.7-bin.zip

      - name: 编译 debug APK（可直接安装）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: CoopanionTablePet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error